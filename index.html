<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>十二生肖闯江湖</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Nunito', 'Microsoft YaHei', sans-serif; color: #e2e8f0; overflow-x: hidden; overflow-y: auto; background: #0a0e17; position: relative; padding: 16px 10px 30px; touch-action: manipulation; overscroll-behavior: none; }
body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(ellipse 80% 50% at 20% 40%, rgba(0,245,212,0.12) 0%, transparent 50%), radial-gradient(ellipse 60% 40% at 80% 60%, rgba(155,93,229,0.15) 0%, transparent 50%), radial-gradient(ellipse 50% 30% at 50% 90%, rgba(0,187,249,0.1) 0%, transparent 50%); animation: bgPulse 8s ease-in-out infinite alternate; }
@keyframes bgPulse { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 1; transform: scale(1.05); } }
.title-area { text-align: center; margin-bottom: 12px; position: relative; z-index: 2; }

.subtitle { font-size: 0.95rem; color: #94a3b8; margin-top: 4px; letter-spacing: 1px; }
.top-bar { display: flex; gap: 5px; margin-bottom: 14px; position: relative; z-index: 2; width: 100%; max-width: 600px; justify-content: center; flex-wrap: nowrap; }
.btn { flex: 1 1 0; min-width: 0; background: rgba(15,23,42,0.85); backdrop-filter: blur(10px); border: 1px solid rgba(148,163,184,0.25); color: #e2e8f0; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.74rem; padding: 10px 2px; border-radius: 50px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn:hover { border-color: #00f5d4; box-shadow: 0 0 20px rgba(0,245,212,0.25); transform: translateY(-2px); }
.btn.active-music { border-color: #f15bb5; color: #f15bb5; }
.btn.cat-off { border-color: #64748b; color: #94a3b8; opacity: 0.7; }
.btn.cat-on { border-color: #ff7676; color: #ff7676; box-shadow: 0 0 16px rgba(255,118,118,0.3); }
.game-wrapper { position: relative; z-index: 2; width: 100%; max-width: 600px; }
.game-container { position: relative; border-radius: 18px; padding: 5px; background: linear-gradient(135deg, #00f5d4, #00bbf9, #9b5de5, #f15bb5); background-size: 300% 300%; animation: borderFlow 6s ease infinite; box-shadow: 0 0 40px rgba(0,245,212,0.28), 0 0 80px rgba(155,93,229,0.18), 0 25px 50px rgba(0,0,0,0.45); width: 100%; }

canvas { display: block; background: #0d1117; width: 100%; height: 100%; }
.ui { display: flex; gap: 12px; margin-top: 14px; justify-content: center; flex-wrap: wrap; position: relative; z-index: 2; }
.stat { background: rgba(15,23,42,0.8); backdrop-filter: blur(12px); padding: 11px 22px; border-radius: 50px; border: 1px solid rgba(148,163,184,0.22); font-size: 1rem; display: flex; align-items: center; gap: 8px; min-width: 120px; justify-content: center; }
.stat .label { color: #94a3b8; font-size: 0.85rem; }
.stat .value { font-weight: 800; font-size: 1.35rem; background: linear-gradient(90deg, #00f5d4, #00bbf9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.stat.high .value { background: linear-gradient(90deg, #f15bb5, #9b5de5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.controls { margin-top: 10px; text-align: center; color: #64748b; font-size: 0.82rem; line-height: 1.6; position: relative; z-index: 2; }
.controls kbd { display: inline-block; background: rgba(30,41,59,0.9); border: 1px solid #475569; border-radius: 5px; padding: 2px 8px; font-family: monospace; color: #e2e8f0; margin: 0 2px; font-size: 0.78rem; box-shadow: 0 2px 0 #334155; }
#overlay { position: absolute; inset: 0; background: rgba(8,12,20,0.9); backdrop-filter: blur(10px); display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 14px; z-index: 20; transition: opacity 0.3s ease; }
#overlay.hidden { opacity: 0; pointer-events: none; }
#overlay h2 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; background: linear-gradient(90deg, #00f5d4, #9b5de5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
#overlay p { color: #94a3b8; margin-bottom: 22px; font-size: 1.1rem; }
#startBtn { background: linear-gradient(135deg, #00f5d4 0%, #00bbf9 50%, #9b5de5 100%); background-size: 200% auto; border: none; color: #0a0e17; font-size: 1.2rem; font-weight: 800; padding: 14px 42px; border-radius: 50px; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 8px 30px rgba(0,245,212,0.45); font-family: 'Nunito', sans-serif; letter-spacing: 1px; }
#startBtn:hover { transform: scale(1.06) translateY(-2px); box-shadow: 0 12px 40px rgba(0,245,212,0.6); background-position: right center; }
.pause-hint { position: absolute; top: 12px; right: 14px; font-size: 0.75rem; color: #475569; z-index: 5; }

.loading-box h2 { font-size: 1.2rem; color: #00f5d4; margin-bottom: 16px; }
.progress-bar-container { width: 100%; height: 10px; background: rgba(15,23,42,0.8); border-radius: 10px; overflow: hidden; border: 1px solid rgba(0,245,212,0.3); }
.progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #00f5d4, #9b5de5); transition: width 0.1s; }
.loading-text { margin-top: 10px; color: #94a3b8; font-size: 0.9rem; }
#achieveModal, #skinModal, #guideModal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); z-index: 50; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
#guideModal { z-index: 60; }
#achieveModal.show, #skinModal.show, #guideModal.show { opacity: 1; pointer-events: auto; }
.skin-card { background: rgba(30,41,59,0.7); border: 2px solid transparent; border-radius: 14px; padding: 14px 8px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
.skin-card:hover { border-color: rgba(0,245,212,0.4); transform: translateY(-3px); }
.skin-card.active { border-color: #00f5d4; background: rgba(0,245,212,0.12); box-shadow: 0 0 18px rgba(0,245,212,0.25); }

.skin-card .skin-emoji { font-size: 2.4rem; margin-bottom: 6px; }
.skin-card .skin-name { font-size: 0.85rem; font-weight: 700; color: #e2e8f0; }
.skin-card .skin-lock { font-size: 0.7rem; color: #94a3b8; margin-top: 4px; }
.achieve-box { width: 90%; max-width: 420px; max-height: 80vh; background: rgba(15,23,42,0.95); border-radius: 20px; border: 1px solid rgba(0,245,212,0.3); box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 40px rgba(0,245,212,0.15); display: flex; flex-direction: column; overflow: hidden; }
.achieve-header { padding: 16px 20px; border-bottom: 1px solid rgba(148,163,184,0.15); display: flex; align-items: center; justify-content: space-between; background: linear-gradient(90deg, rgba(0,245,212,0.1), rgba(155,93,229,0.1)); }
.achieve-header h3 { font-size: 1.2rem; font-weight: 800; background: linear-gradient(90deg, #00f5d4, #9b5de5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.achieve-progress-bar { height: 100%; background: linear-gradient(90deg, #00f5d4, #9b5de5); border-radius: 2px; transition: width 0.4s; }
#achieveToast { position: fixed; top: 28px; left: 50%; transform: translateX(-50%) translateY(-130px); background: linear-gradient(135deg, rgba(15,23,42,0.96), rgba(30,41,59,0.96)); border: 1px solid rgba(0,245,212,0.45); border-radius: 16px; padding: 14px 26px; display: flex; align-items: center; gap: 12px; z-index: 100; box-shadow: 0 15px 40px rgba(0,245,212,0.25); transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none; min-width: 260px; }
#achieveToast.show { transform: translateX(-50%) translateY(0); }
#achieveToast .toast-icon { font-size: 1.9rem; }
#achieveToast .toast-text h4 { font-size: 0.75rem; color: #00f5d4; letter-spacing: 2px; margin-bottom: 2px; }
#achieveToast .toast-text p { font-size: 1.1rem; font-weight: 800; background: linear-gradient(90deg, #00f5d4, #f15bb5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.score-pop { position: absolute; font-weight: 800; font-size: 1.2rem; color: #00f5d4; pointer-events: none; animation: scoreFloat 0.85s ease-out forwards; text-shadow: 0 0 12px rgba(0,245,212,0.9); z-index: 15; }
@keyframes scoreFloat { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-45px) scale(1.35); } }
.mobile-controls { display: none; margin-top: 14px; position: relative; z-index: 2; }
.dpad { display: grid; grid-template-columns: 68px 68px 68px; grid-template-rows: 68px 68px 68px; gap: 8px; justify-content: center; touch-action: none; }
.dpad button { width: 68px; height: 68px; border-radius: 18px; border: 1px solid rgba(148,163,184,0.25); background: rgba(15,23,42,0.85); color: #e2e8f0; font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; transition: all 0.15s; }
.dpad button:active, .dpad button.pressed { background: rgba(0,245,212,0.3); border-color: #00f5d4; transform: scale(0.92); }
.dpad .up { grid-column: 2; grid-row: 1; } .dpad .left { grid-column: 1; grid-row: 2; } .dpad .right { grid-column: 3; grid-row: 2; } .dpad .down { grid-column: 2; grid-row: 3; } .dpad .pause-btn { grid-column: 2; grid-row: 2; font-size: 0.95rem; font-weight: 700; color: #94a3b8; }
.music-hint { font-size: 0.75rem; color: #64748b; margin-top: 6px; text-align: center; position: relative; z-index: 2; }
.guide-box { width: 92%; max-width: 720px; height: 80vh; max-height: 620px; background: rgba(15,23,42,0.98); border-radius: 20px; border: 1px solid rgba(0,245,212,0.3); box-shadow: 0 25px 60px rgba(0,0,0,0.5), 0 0 40px rgba(0,245,212,0.15); display: flex; flex-direction: column; overflow: hidden; }
.guide-header { padding: 14px 20px; border-bottom: 1px solid rgba(148,163,184,0.15); display: flex; align-items: center; justify-content: space-between; background: linear-gradient(90deg, rgba(0,245,212,0.1), rgba(155,93,229,0.1)); flex-shrink: 0; }
.guide-header h3 { font-size: 1.15rem; font-weight: 800; background: linear-gradient(90deg, #00f5d4, #9b5de5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.guide-body { flex: 1; display: flex; overflow: hidden; min-height: 0; }
.guide-nav { width: 160px; flex-shrink: 0; border-right: 1px solid rgba(148,163,184,0.12); padding: 10px 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; scrollbar-width: thin; scrollbar-color: #334155 transparent; }
.guide-nav-btn { background: transparent; border: 1px solid transparent; color: #94a3b8; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.82rem; padding: 9px 12px; border-radius: 10px; cursor: pointer; text-align: left; transition: all 0.2s; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.guide-nav-btn:hover { background: rgba(0,245,212,0.08); color: #e2e8f0; }
.guide-nav-btn.active { background: linear-gradient(90deg, rgba(0,245,212,0.18), rgba(155,93,229,0.18)); color: #00f5d4; border-color: rgba(0,245,212,0.3); }
.guide-content { flex: 1; padding: 18px 22px; overflow-y: auto; color: #cbd5e1; font-size: 0.88rem; line-height: 1.7; scrollbar-width: thin; scrollbar-color: #334155 transparent; min-width: 0; }
.guide-content h4 { color: #00f5d4; font-size: 1.05rem; margin-bottom: 10px; margin-top: 6px; font-weight: 800; }
.guide-content h4:first-child { margin-top: 0; }

.guide-content .card { background: rgba(30,41,59,0.5); border: 1px solid rgba(148,163,184,0.15); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; }
.guide-content .card .title { color: #00f5d4; font-weight: 800; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; font-size: 0.92rem; }

@media (max-width: 640px) {
  .mobile-controls { display: block; }
  .controls { display: none; }
  h1 { font-size: 1.9rem; }
  .btn { font-size: 0.7rem; padding: 9px 1px; }
  .top-bar { gap: 4px; }
  .guide-box { width: 95%; height: 85vh; max-height: none; }
  .guide-body { flex-direction: column; }
  .guide-nav { width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden; border-right: none; border-bottom: 1px solid rgba(148,163,184,0.12); padding: 8px 6px; gap: 4px; flex-shrink: 0; }
  .guide-nav-btn { flex-shrink: 0; padding: 7px 12px; font-size: 0.75rem; }
  .guide-content { padding: 14px 16px; font-size: 0.82rem; }
}
</style>
</head>
<body>
<div class="title-area">
<h1>🐍 十二生肖闯江湖</h1>
<p class="subtitle">宝宝专属 · 修炼之路由此开启</p>
</div>
<div class="top-bar">
<button class="btn" id="achieveBtn">📜 成就</button>
<button class="btn" id="skinBtn">🎨 皮肤</button>
<button class="btn" id="guideBtn">📖 指南</button>
<button class="btn" id="musicBtn">🎵 音乐开</button>
<button class="btn cat-on" id="catModeBtn">🐱 猫咪: 开</button>
</div>
<div class="game-wrapper">
<div class="game-container">
<div class="canvas-inner">
<canvas id="gameCanvas"></canvas>
<div id="loadingScreen">
<div class="loading-box">
<h2>🐑 资源加载中...</h2>
<div class="progress-bar-container"><div class="progress-bar" id="loadingProgress"></div></div>
<p class="loading-text" id="loadingText">0%</p>
</div>
</div>
<div id="overlay">
<h2 id="overlayTitle">十二生肖闯江湖</h2>
<p id="overlayMsg">准备好踏入江湖了吗？</p>
<button id="startBtn">开始修炼</button>
</div>
<div class="pause-hint">空格 · 暂停</div>
</div>
</div>
</div>
<div class="ui">
<div class="stat"><span class="label">积分</span><span class="value" id="score">0</span></div>
<div class="stat high"><span class="label">最高</span><span class="value" id="highScore">0</span></div>
<div class="stat"><span class="label">体长</span><span class="value" id="length">3</span></div>
</div>
<div class="controls">方向：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &nbsp;·&nbsp; <kbd>空格</kbd> 暂停</div>
<p class="music-hint">全程常驻BGM · 菜单缓和 / 游戏随分数升燃 · 音乐来自 soundimage.org（Eric Matyas）</p>
<div class="mobile-controls">
<div class="dpad">
<button class="up" data-dir="up">▲</button>
<button class="left" data-dir="left">◀</button>
<button class="pause-btn" id="mobilePause">❚❚</button>
<button class="right" data-dir="right">▶</button>
<button class="down" data-dir="down">▼</button>
</div>
</div>
<div id="achieveModal"><div class="achieve-box"><div class="achieve-header"><h3>📜 江湖成就</h3><div style="display:flex;align-items:center;gap:10px;"><span class="achieve-count" id="achieveCount">0/12</span><button class="close-btn" id="closeAchieve">×</button></div></div><div class="achieve-list" id="achieveList"></div></div></div>
<div id="skinModal"><div class="achieve-box" style="max-width:480px;"><div class="achieve-header"><h3>🎨 生肖皮肤</h3><button class="close-btn" id="closeSkin">×</button></div><div class="skin-list" id="skinList" style="padding:16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px; max-height:55vh; overflow-y:auto;"></div></div></div>
<div id="guideModal"><div class="guide-box"><div class="guide-header"><h3>📖 游戏指南</h3><button class="close-btn" id="closeGuide">×</button></div><div class="guide-body"><div class="guide-nav" id="guideNav"></div><div class="guide-content" id="guideContent"></div></div></div></div>
<div id="achieveToast"><div class="toast-icon" id="toastIcon">🏆</div><div class="toast-text"><h4>成就解锁</h4><p id="toastName">初入江湖</p></div></div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const lengthEl = document.getElementById('length');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayMsg = document.getElementById('overlayMsg');
const startBtn = document.getElementById('startBtn');
const achieveListEl = document.getElementById('achieveList');
const achieveCountEl = document.getElementById('achieveCount');
const achieveToast = document.getElementById('achieveToast');
const toastIcon = document.getElementById('toastIcon');
const toastName = document.getElementById('toastName');
const achieveModal = document.getElementById('achieveModal');
const musicBtn = document.getElementById('musicBtn');
const skinBtn = document.getElementById('skinBtn');
const skinModal = document.getElementById('skinModal');
const skinListEl = document.getElementById('skinList');
const catModeBtn = document.getElementById('catModeBtn');
const guideBtn = document.getElementById('guideBtn');
const guideModal = document.getElementById('guideModal');
const guideNavEl = document.getElementById('guideNav');
const guideContentEl = document.getElementById('guideContent');

const LOGICAL_SIZE = 600, GRID = 20, COLS = 30, ROWS = 30;
const dpr = window.devicePixelRatio || 1;
canvas.width = LOGICAL_SIZE * dpr;
canvas.height = LOGICAL_SIZE * dpr;
ctx.scale(dpr, dpr);

let snake, direction, nextDirection, food, score, highScore;
let rafId = null, loopActive = false, lastFrameTs = 0, accumulator = 0, survivalAccumulator = 0;
let isPaused, isGameOver, isDying, speed;
let particles = [], foodPulse = 0, foodsEaten = 0, maxLengthReached = 3, totalScoreAccum = 0;
let shakeAmount = 0;
let ghostTrail = [];
const GHOST_LENGTH = 22;
let musicEnabled = true, currentBgmKey = '', bgmRetryTimer = null;
let cornerEaten = new Set(), survivalTime = 0, fastEats = 0;
let cheatSkins = new Set(JSON.parse(localStorage.getItem('snakeCheatSkins') || '[]'));
let speedFactor = 1, shieldActive = false, buffSpeedTimer = 0;
let specialFood = null, specialFoodTimer = 0;
const SPECIAL_FOOD_DURATION = 8000;
let specialFoodCooldown = 0;

function drawImageHelper(img, cx, cy, dpx) {
if (!img || !img.complete || !img.naturalWidth) return false;
const s = dpx / img.naturalWidth;
const w = img.naturalWidth * s, h = img.naturalHeight * s;
ctx.drawImage(img, cx - w/2, cy - h/2, w, h);
return true;
}

function getGhostColor() {
if (score < 80) return { r:0, g:245, b:212 };

if (score < 400) { const t = (score-200)/200; return { r:255, g:Math.floor(145-t*100), b:Math.floor(62+t*50) }; }
if (score < 700) { const t = (score-400)/300; return { r:Math.floor(255-t*100), g:Math.floor(45-t*45), b:Math.floor(112+t*143) }; }
return { r:155, g:0, b:255 };
}

function startLoop() { stopLoop(); lastFrameTs=0; accumulator=0; loopActive=true; rafId=requestAnimationFrame(frame); }
function stopLoop() { loopActive=false; if (rafId) { cancelAnimationFrame(rafId); rafId=null; } }
function frame(timestamp) {
if (!loopActive) return;
if (!lastFrameTs) lastFrameTs = timestamp;
let delta = timestamp - lastFrameTs;
lastFrameTs = timestamp;
if (delta > 100) delta = 100;
if (buffSpeedTimer > 0) { buffSpeedTimer -= delta; if (buffSpeedTimer <= 0) { buffSpeedTimer=0; speedFactor=1; } }
if (!isPaused && !isGameOver) {
accumulator += delta;
const currentSpeed = speed * speedFactor;
let steps = 0;
while (accumulator >= currentSpeed && steps < 5) { update(); accumulator -= currentSpeed; steps++; if (isGameOver) break; }
if (steps >= 5) accumulator = 0;
}
updateParticles(); draw();
if (loopActive && (!isGameOver || isDying)) { rafId = requestAnimationFrame(frame); } else { stopLoop(); }
}

function placeFood() {
let valid = false;
while (!valid) {
food = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
valid = !snake.some(s => s.x === food.x && s.y === food.y);
if (valid && specialFood) valid = !(specialFood.x === food.x && specialFood.y === food.y);
}
}
function spawnSpecialFood() {
if (specialFood) return;
if (specialFoodCooldown > 0) return;
let valid = false, sf, attempts = 0;
while (!valid && attempts < 200) {
attempts++;
sf = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS), type:'gold' };
const r = Math.random();
if (r < 0.25) sf.type = 'gold';
else if (r < 0.5) sf.type = 'speed';
else if (r < 0.75) sf.type = 'shield';
else sf.type = 'shrink';
valid = !snake.some(s => s.x === sf.x && s.y === sf.y);
if (valid && food) valid = !(food.x === sf.x && food.y === sf.y);
}
if (valid) { specialFood = sf; specialFoodTimer = SPECIAL_FOOD_DURATION; }
}
function spawnParticles(x, y, color) { for (let i=0;i<14;i++) { const angle=(Math.PI*2*i)/14+Math.random()*0.5; const spd=1.8+Math.random()*2.8; particles.push({x:x*GRID+GRID/2,y:y*GRID+GRID/2,vx:Math.cos(angle)*spd,vy:Math.sin(angle)*spd,life:1,decay:0.022+Math.random()*0.02,size:2.5+Math.random()*3.5,color}); } }
function updateParticles() { for (let i=particles.length-1;i>=0;i--) { const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.95; p.vy*=0.95; p.life-=p.decay; if (p.life<=0) particles.splice(i,1); } }
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

function spawnCat() {
let valid = false, catX, catY, attempts = 0;
while (!valid && attempts < 200) {
attempts++;
catX = Math.floor(Math.random()*COLS);
catY = Math.floor(Math.random()*ROWS);
const tooCloseToSnake = snake.some(s => Math.abs(s.x-catX)+Math.abs(s.y-catY) < 5);
const tooCloseToFood = Math.abs(food.x-catX)+Math.abs(food.y-catY) < 3;
const tooCloseToSpecial = specialFood && (Math.abs(specialFood.x-catX)+Math.abs(specialFood.y-catY) < 3);
if (!tooCloseToSnake && !tooCloseToFood && !tooCloseToSpecial) valid = true;
}
cat = { x:catX, y:catY, dir:{x:0,y:0}, moveTimer:0 };
catActive = true; catBiteLosses = 0;
showCheatToast('🐱 野猫出现！小心尾巴！');
}

function updateCat() {
if (!catActive || !cat || isPaused || isGameOver) return;
cat.moveTimer++;
if (cat.moveTimer < 2) return;
cat.moveTimer = 0;
if (snake[0].x === cat.x && snake[0].y === cat.y) {
if (shieldActive) { shieldActive=false; showCheatToast('🛡️ 护盾抵挡了野猫！'); catActive=false; cat=null; catTrail=[]; return; }
else { gameOver('被野猫正面抓住'); return; }
}
const head = snake[0];
const dx = head.x-cat.x, dy = head.y-cat.y;
let moveX=0, moveY=0;
if (Math.abs(dx) >= Math.abs(dy)) moveX = dx>0?1:(dx<0?-1:0);
else moveY = dy>0?1:(dy<0?-1:0);
const newX = cat.x+moveX, newY = cat.y+moveY;
if (newX>=0 && newX<COLS && newY>=0 && newY<ROWS) {
if (!snake.some(s => s.x===newX && s.y===newY)) { cat.x=newX; cat.y=newY; cat.dir={x:moveX,y:moveY}; }
}
catTrail.push({x:cat.x,y:cat.y});
if (catTrail.length > 6) catTrail.shift();
if (snake[0].x === cat.x && snake[0].y === cat.y) {
if (shieldActive) { shieldActive=false; showCheatToast('🛡️ 护盾抵挡了野猫！'); catActive=false; cat=null; catTrail=[]; return; }
else { gameOver('被野猫正面抓住'); return; }
}
if (snake.length > 3) {
for (let i=snake.length-1; i>=3; i--) {
if (snake[i].x === cat.x && snake[i].y === cat.y) {
const biteIndex = i;
const removedCount = snake.length - biteIndex;
snake = snake.slice(0, biteIndex);
catBiteLosses += removedCount;
vibrate([120,60,120,60,120]); shakeAmount = 28;
spawnParticles(cat.x, cat.y, '#ff4444'); spawnParticles(cat.x, cat.y, '#ffaa00');
lengthEl.textContent = snake.length;
if (catBiteLosses >= CAT_BITE_LOSS_LIMIT) { showCheatToast(`🐱 尾巴被咬断！累计损失 ${catBiteLosses} 节，力竭而亡！`); gameOver('被野猫咬断尾巴'); }
else { showCheatToast(`🐱 尾巴被咬断！失去 ${removedCount} 节（累计 ${catBiteLosses}/${CAT_BITE_LOSS_LIMIT}）`); }
break;
}
}
}
}

function isCatTrapped() {
if (!catActive || !cat) return false;
const startX = cat.x, startY = cat.y;
if (startX===0 || startX===COLS-1 || startY===0 || startY===ROWS-1) return false;
const visited = new Set(); const queue = [{x:startX,y:startY}];
visited.add(startX+','+startY);
const dirs = [{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
while (queue.length > 0) {
const { x, y } = queue.shift();
if (x===0 || x===COLS-1 || y===0 || y===ROWS-1) return false;
for (const d of dirs) {
const nx = x+d.x, ny = y+d.y;
if (nx<0 || nx>=COLS || ny<0 || ny>=ROWS) continue;
const key = nx+','+ny;

function update() {
if (isPaused || isGameOver) return;
survivalAccumulator += speed;
while (survivalAccumulator >= 1000) { survivalAccumulator -= 1000; survivalTime++; }
if (specialFood) { specialFoodTimer -= speed; if (specialFoodTimer <= 0) { specialFood = null; specialFoodTimer = 0; specialFoodCooldown = 2000; } }
if (specialFoodCooldown > 0) { specialFoodCooldown -= speed; if (specialFoodCooldown < 0) specialFoodCooldown = 0; }
if (!catActive && catModeEnabled && score >= CAT_ACTIVATE_SCORE) spawnCat();
direction = { ...nextDirection };
const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
if (shieldActive) { shieldActive=false; showCheatToast('🛡️ 护盾抵挡了墙壁！'); return; }
else { gameOver('撞墙了'); return; }
}
if (snake.some(s => s.x === head.x && s.y === head.y)) {
if (shieldActive) { shieldActive=false; showCheatToast('🛡️ 护盾抵挡了自咬！'); return; }
else { gameOver('咬到自己了'); return; }
}
snake.unshift(head);
let ateSomething = false;
if (head.x === food.x && head.y === food.y) {
ateSomething = true;
foodsEaten++;
vibrate([100, 40, 100]); shakeAmount = 18;
let baseScore = 10;
if (buffSpeedTimer > 0) baseScore *= 2;
score += baseScore;
scoreEl.textContent = score; lengthEl.textContent = snake.length;
maxLengthReached = Math.max(maxLengthReached, snake.length);
const isCorner = (food.x===0 || food.x===COLS-1) && (food.y===0 || food.y===ROWS-1);
if (isCorner) cornerEaten.add(food.x+','+food.y);
if (speed <= MIN_SPEED+5) fastEats++;
showScorePop(food.x, food.y);
spawnParticles(food.x, food.y, '#ff6b6b'); spawnParticles(food.x, food.y, '#00f5d4');
if (score > highScore) { highScore = score; highScoreEl.textContent = highScore; localStorage.setItem(HIGH_KEY, highScore); }
placeFood();
if (!specialFood && Math.random() < 0.35) spawnSpecialFood();
checkAchievements(); updateGameBgm();
const newSpeed = calcSpeed();
if (newSpeed !== speed) { speed = newSpeed; accumulator = 0; }
} else if (specialFood && head.x === specialFood.x && head.y === specialFood.y) {
ateSomething = true;
foodsEaten++;
vibrate([100,50,100]); shakeAmount = 22;
let baseScore = 10;
if (buffSpeedTimer > 0) baseScore *= 2;
if (specialFood.type === 'gold') { baseScore = 20; showCheatToast('💰 金元宝！积分双倍！'); }
else if (specialFood.type === 'speed') { buffSpeedTimer = 5000; speedFactor = 0.6; showCheatToast('⚡ 加速药水！速度提升，分数翻倍！'); }
else if (specialFood.type === 'shield') { shieldActive = true; showCheatToast('🛡️ 护盾铃铛！免疫一次死亡！'); }
else if (specialFood.type === 'shrink') { const newLen = Math.max(3, Math.floor(snake.length/2)); snake = snake.slice(0, newLen); lengthEl.textContent = snake.length; showCheatToast('🧪 缩小药水！身体缩短一半！'); }
score += baseScore;
scoreEl.textContent = score; lengthEl.textContent = snake.length;
maxLengthReached = Math.max(maxLengthReached, snake.length);
showScorePop(specialFood.x, specialFood.y);
spawnParticles(specialFood.x, specialFood.y, '#ffaa00'); spawnParticles(specialFood.x, specialFood.y, '#ffffff');
if (score > highScore) { highScore = score; highScoreEl.textContent = highScore; localStorage.setItem(HIGH_KEY, highScore); }
specialFood = null; specialFoodTimer = 0; specialFoodCooldown = 3000;
checkAchievements(); updateGameBgm();
const newSpeed = calcSpeed();
if (newSpeed !== speed) { speed = newSpeed; accumulator = 0; }
}
if (!ateSomething) snake.pop();
if (!isGameOver) {
recordGhost();
updateCat();
if (catActive && cat && isCatTrapped()) {
const cx = cat.x, cy = cat.y;
catActive = false; cat = null; catTrail = []; catBiteLosses = 0;
vibrate([200,100,200]); shakeAmount = 25;
score += 50; scoreEl.textContent = score;
if (score > highScore) { highScore = score; highScoreEl.textContent = highScore; localStorage.setItem(HIGH_KEY, highScore); }
showCheatToast('🎉 你围死了野猫！奖励 50 分！');
spawnParticles(cx, cy, '#ffaa00'); spawnParticles(cx, cy, '#ff4444');
}
}
}

function showScorePop(gx, gy) { const pop = document.createElement('div'); pop.className='score-pop'; pop.textContent='+10'; pop.style.left = ((gx+0.5)/COLS*100)+'%'; pop.style.top = ((gy+0.5)/ROWS*100)+'%'; document.querySelector('.canvas-inner').appendChild(pop); setTimeout(()=>pop.remove(),850); }
function tick() { update(); updateParticles(); draw(); }

function gameOver(reason) {
if (isGameOver) return;
isGameOver = true; isDying = true;
vibrate([500, 150, 500, 150, 500]); shakeAmount = 35;
totalScoreAccum += score; saveAchievements(); checkAchievements();
snake.forEach((s,i) => { if (i%2===0) spawnParticles(s.x, s.y, '#00f5d4'); });
setTimeout(() => {
isDying = false;
stopLoop();
overlayTitle.textContent = '修炼失败';
overlayMsg.textContent = `${reason || '本局结束'} · 积分 ${score} · 体长 ${snake.length}`;
startBtn.textContent = '再次入世';
overlay.classList.remove('hidden');
playBgm('menu');
}, 1200);
}
function startGame() { startBtn.style.display='block'; stopLoop(); initGame(); startLoop(); }
function togglePause() {
if (isGameOver) { startGame(); return; }
if (!loopActive && !isPaused) { startGame(); return; }
isPaused = !isPaused;
if (isPaused) { stopLoop(); playBgm('menu'); overlayTitle.textContent='暂时闭关'; overlayMsg.textContent='按空格继续修炼'; startBtn.style.display='none'; overlay.classList.remove('hidden'); }
else { overlay.classList.add('hidden'); startBtn.style.display='block'; updateGameBgm(); startLoop(); }
}
function setDirection(dir) { if (isPaused || isGameOver) return; if (dir==='up' && direction.y===0) nextDirection={x:0,y:-1}; else if (dir==='down' && direction.y===0) nextDirection={x:0,y:1}; else if (dir==='left' && direction.x===0) nextDirection={x:-1,y:0}; else if (dir==='right' && direction.x===0) nextDirection={x:1,y:0}; }

// ===== 手机端作弊：连点标题 5 次解锁全部 =====
let titleTapCount = 0;
let titleTapTimer = null;
document.querySelector('h1').addEventListener('click', () => {
    titleTapCount++;
    clearTimeout(titleTapTimer);
    if (titleTapCount >= 5) {
        titleTapCount = 0;
        cheatUnlockAll();
        return;
    }
    titleTapTimer = setTimeout(() => { titleTapCount = 0; }, 2000);
});

let cheatBuffer = '';
document.addEventListener('keydown', (e) => {
const key = e.key.toLowerCase();
if (['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d'].includes(key)) e.preventDefault();
if (key === ' ') { togglePause(); return; }
if (key === 'arrowup' || key === 'w') setDirection('up');
else if (key === 'arrowdown' || key === 's') setDirection('down');
else if (key === 'arrowleft' || key === 'a') setDirection('left');
else if (key === 'arrowright' || key === 'd') setDirection('right');
if (e.key >= '0' && e.key <= '9') {
cheatBuffer += e.key;
if (cheatBuffer.length > 6) cheatBuffer = cheatBuffer.slice(-6);
if (cheatBuffer.endsWith('520')) { cheatUnlockSkins(); cheatBuffer=''; }
else if (cheatBuffer.endsWith('1314')) { cheatUnlockAll(); cheatBuffer=''; }
}
});

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());

const dpadButtons = document.querySelectorAll('.dpad button[data-dir]');
if (window.PointerEvent) {
dpadButtons.forEach(btn => {
btn.addEventListener('pointerdown', e => { e.preventDefault(); btn.classList.add('pressed'); setDirection(btn.dataset.dir); });
btn.addEventListener('pointerup', () => btn.classList.remove('pressed'));
btn.addEventListener('pointercancel', () => btn.classList.remove('pressed'));
btn.addEventListener('pointerleave', () => btn.classList.remove('pressed'));
});
} else {
dpadButtons.forEach(btn => {
btn.addEventListener('touchstart', e => { e.preventDefault(); btn.classList.add('pressed'); setDirection(btn.dataset.dir); }, { passive: false });
btn.addEventListener('touchend', () => btn.classList.remove('pressed'));
btn.addEventListener('touchcancel', () => btn.classList.remove('pressed'));
btn.addEventListener('mousedown', e => { e.preventDefault(); setDirection(btn.dataset.dir); });
});
}
document.getElementById('mobilePause').addEventListener('click', togglePause);
startBtn.addEventListener('click', () => { startBtn.style.display='block'; startGame(); });
document.getElementById('achieveBtn').addEventListener('click', () => { renderAchievements(); achieveModal.classList.add('show'); });
document.getElementById('closeAchieve').addEventListener('click', () => achieveModal.classList.remove('show'));
achieveModal.addEventListener('click', (e) => { if (e.target === achieveModal) achieveModal.classList.remove('show'); });

function isSkinUnlocked(skin) { return !skin.unlockId || unlocked.includes(skin.unlockId) || cheatSkins.has(skin.unlockId); }
function renderSkins() {
skinListEl.innerHTML = '';
Object.values(SKINS).forEach(skin => {
const unlockedSkin = isSkinUnlocked(skin);
const card = document.createElement('div');
card.className = 'skin-card' + (currentSkinId === skin.id ? ' active' : '') + (!unlockedSkin ? ' locked' : '');
card.innerHTML = `<div class="skin-emoji">${skin.emoji}</div><div class="skin-name">${skin.name}</div>${!unlockedSkin ? '<div class="skin-lock">🔒 未解锁</div>' : (currentSkinId === skin.id ? '<div class="skin-lock" style="color:#00f5d4">使用中</div>' : '')}`;
if (unlockedSkin) card.addEventListener('click', () => { currentSkinId = skin.id; localStorage.setItem('snakeCurrentSkin', currentSkinId); renderSkins(); draw(); });
skinListEl.appendChild(card);
});
}
skinBtn.addEventListener('click', () => { renderSkins(); skinModal.classList.add('show'); });
document.getElementById('closeSkin').addEventListener('click', () => skinModal.classList.remove('show'));
skinModal.addEventListener('click', (e) => { if (e.target === skinModal) skinModal.classList.remove('show'); });
musicBtn.addEventListener('click', () => { musicEnabled = !musicEnabled; if (musicEnabled) { musicBtn.textContent = '🎵 音乐开'; musicBtn.classList.remove('active-music'); if (isGameOver || isPaused || !loopActive) playBgm('menu'); else updateGameBgm(); } else { musicBtn.textContent = '🔇 音乐关'; musicBtn.classList.add('active-music'); stopBgm(); } });

function updateCatModeBtn() {
if (catModeEnabled) {
catModeBtn.textContent = '🐱 猫咪: 开';
catModeBtn.classList.remove('cat-off');
catModeBtn.classList.add('cat-on');
} else {
catModeBtn.textContent = '🐱 猫咪: 关';
catModeBtn.classList.remove('cat-on');
catModeBtn.classList.add('cat-off');
}
}
catModeBtn.addEventListener('click', () => {
catModeEnabled = !catModeEnabled;
localStorage.setItem('snakeCatMode', catModeEnabled ? '1' : '0');
updateCatModeBtn();
if (catModeEnabled && score >= CAT_ACTIVATE_SCORE && !catActive && !isGameOver) {
spawnCat();
}
if (!catModeEnabled) {
catActive = false;
cat = null;
catTrail = [];
}
});
updateCatModeBtn();

let currentGuideKey = 'basic';
function renderGuideNav() {
guideNavEl.innerHTML = '';
GUIDE_DATA.forEach(g => {
const btn = document.createElement('button');
btn.className = 'guide-nav-btn' + (currentGuideKey === g.id ? ' active' : '');
btn.innerHTML = `${g.icon} ${g.title}`;
btn.addEventListener('click', () => {
currentGuideKey = g.id;
renderGuideNav();
renderGuideContent();
});
guideNavEl.appendChild(btn);
});
}
function renderGuideContent() {
const g = GUIDE_DATA.find(x => x.id === currentGuideKey) || GUIDE_DATA[0];
guideContentEl.innerHTML = g.content;
}
guideBtn.addEventListener('click', () => {
currentGuideKey = 'basic';
renderGuideNav();
renderGuideContent();
guideModal.classList.add('show');
});
document.getElementById('closeGuide').addEventListener('click', () => guideModal.classList.remove('show'));
guideModal.addEventListener('click', (e) => { if (e.target === guideModal) guideModal.classList.remove('show'); });

let bgmUnlocked = false;
function unlockBgm() { if (bgmUnlocked) return; bgmUnlocked = true; if (musicEnabled) playBgm('menu'); }
document.addEventListener('click', unlockBgm, { once: true });
document.addEventListener('keydown', unlockBgm, { once: true });
document.addEventListener('touchstart', unlockBgm, { once: true });

function startLoadingScreen() {
const loadingScreen = document.getElementById('loadingScreen');
const progressBar = document.getElementById('loadingProgress');
const loadingText = document.getElementById('loadingText');
loadingScreen.style.display = 'flex';
document.getElementById('overlay').classList.add('hidden');
let loadedCount = 0;
const total = ASSET_KEYS.length;
let finished = false;
function updateProgress() {
const pct = Math.floor(loadedCount / total * 100);
progressBar.style.width = pct + '%';
loadingText.textContent = pct + '%';
}
function finish() {
if (finished) return;
finished = true;
progressBar.style.width = '100%';
loadingText.textContent = '100%';
setTimeout(() => {
loadingScreen.style.display = 'none';
initGame();
renderAchievements();
draw();
document.getElementById('overlay').classList.remove('hidden');
document.getElementById('overlayTitle').textContent = '十二生肖闯江湖';
document.getElementById('overlayMsg').textContent = '准备好踏入江湖了吗？';
document.getElementById('startBtn').textContent = '开始修炼';
document.getElementById('startBtn').style.display = 'block';
}, 300);
}
ASSET_KEYS.forEach(key => {
let img;
if (key === 'cat_head') img = CAT_ASSET;
else if (key.startsWith('rab_')) img = RABBIT_ASSETS[key.replace('rab_', '')];
else if (key.startsWith('dragon_')) img = DRAGON_ASSETS[key.replace('dragon_', '')];
else if (key.startsWith('snake_')) img = SNAKE_ASSETS[key.replace('snake_', '')];
else if (key.startsWith('horse_')) img = HORSE_ASSETS[key.replace('horse_', '')];
else if (key.startsWith('sheep_')) img = SHEEP_ASSETS[key.replace('sheep_', '')];
else img = TIGER_ASSETS[key];
let done = false;
const complete = () => {
if (done) return;
done = true;
loadedCount++;
updateProgress();
if (loadedCount === total) finish();
};
const timer = setTimeout(() => { console.warn('资源加载超时:', key); complete(); }, 5000);
img.onload = () => { clearTimeout(timer); complete(); };
img.onerror = () => { console.warn('资源加载失败:', key); clearTimeout(timer); complete(); };
img.src = ASSET_URLS[key];
});
}
Object.values(BGM).forEach(url => { const pre = new Audio(); pre.preload = 'auto'; pre.src = url; });
audio.src = BGM.menu;
startLoadingScreen();
