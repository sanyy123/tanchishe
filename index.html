<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>十二生肖闯江湖</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="title-area">
<h1>🐍 十二生肖闯江湖</h1>
<p class="subtitle">宝宝专属 · 修炼之路由此开启</p>
</div>
<div class="top-bar">
<button class="btn" id="achieveBtn">📜 成就</button>
<button class="btn" id="skinBtn">🎨 皮肤</button>
<button class="btn" id="guideBtn">📖 指南</button>
<button class="btn" id="musicBtn">🎵 音乐开</button>
<button class="btn cat-on" id="catModeBtn">🐱 猫咪: 开</button>
<button class="btn obs-on" id="obsModeBtn">🚧 障碍: 开</button>
</div>
<div class="game-wrapper">
<div class="game-container">
<div class="canvas-inner">
<canvas id="gameCanvas"></canvas>
<div id="loadingScreen">
<div class="loading-box">
<h2>🐑 资源加载中...</h2>
<div class="progress-bar-container"><div class="progress-bar" id="loadingProgress"></div></div>
<p class="loading-text" id="loadingText">0%</p>
</div>
</div>
<div id="overlay">
<h2 id="overlayTitle">十二生肖闯江湖</h2>
<p id="overlayMsg">准备好踏入江湖了吗？</p>
<button id="startBtn">开始修炼</button>
</div>
<div class="pause-hint">空格 · 暂停</div>
</div>
</div>
</div>
<div class="ui">
<div class="stat"><span class="label">积分</span><span class="value" id="score">0</span></div>
<div class="stat high"><span class="label">最高</span><span class="value" id="highScore">0</span></div>
<div class="stat"><span class="label">体长</span><span class="value" id="length">3</span></div>
</div>
<div class="controls">方向：<kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> &nbsp;·&nbsp; <kbd>空格</kbd> 暂停</div>
<p class="music-hint">全程常驻BGM · 菜单缓和 / 游戏随分数升燃 · 音乐来自 soundimage.org（Eric Matyas）</p>
<div class="mobile-controls">
<div class="dpad">
<button class="up" data-dir="up">▲</button>
<button class="left" data-dir="left">◀</button>
<button class="pause-btn" id="mobilePause">❚❚</button>
<button class="right" data-dir="right">▶</button>
<button class="down" data-dir="down">▼</button>
</div>
</div>
<div id="achieveModal"><div class="achieve-box"><div class="achieve-header"><h3>📜 江湖成就</h3><div style="display:flex;align-items:center;gap:10px;"><span class="achieve-count" id="achieveCount">0/12</span><button class="close-btn" id="closeAchieve">×</button></div></div><div class="achieve-list" id="achieveList"></div></div></div>
<div id="skinModal"><div class="achieve-box" style="max-width:480px;"><div class="achieve-header"><h3>🎨 生肖皮肤</h3><button class="close-btn" id="closeSkin">×</button></div><div class="skin-list" id="skinList" style="padding:16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:12px; max-height:55vh; overflow-y:auto;"></div></div></div>
<div id="guideModal"><div class="guide-box"><div class="guide-header"><h3>📖 游戏指南</h3><button class="close-btn" id="closeGuide">×</button></div><div class="guide-body"><div class="guide-nav" id="guideNav"></div><div class="guide-content" id="guideContent"></div></div></div></div>
<div id="achieveToast"><div class="toast-icon" id="toastIcon">🏆</div><div class="toast-text"><h4>成就解锁</h4><p id="toastName">初入江湖</p></div></div>
<script src="data.js"></script>
<script src="game.js"></script>
<script src="ui.js"></script>
</body>
</html>
